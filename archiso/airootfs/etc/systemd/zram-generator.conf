# Zog swap-on-zram configuration (zram-generator)
#
# On the 8GB ThinkPad L13 target this creates a 4GB compressed swap device
# in RAM (min of half the RAM and 4096MB). zstd typically achieves ~3:1
# compression, so this adds meaningful headroom without touching the SSD.
#
# zram-generator activates this automatically at boot via a systemd
# generator — no kernel parameter or service enablement is needed.
# Verify with: zramctl && swapon --show

[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
