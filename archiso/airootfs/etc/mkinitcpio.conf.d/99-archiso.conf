# Live-ISO initramfs hooks (archiso + archiso_loop_mnt mount the airootfs).
# Drop-ins are sourced after mkinitcpio.conf and later files win — the 99-
# prefix guarantees these hooks are used when building the live ISO.
# The Calamares shellprocess module deletes this file during install and
# regenerates the initramfs, so installed systems use /etc/mkinitcpio.conf.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
