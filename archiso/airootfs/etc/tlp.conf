# TLP Configuration for ThinkPad L13 (i3-11th gen, 8GB, 256GB SSD)
# Performance-balanced power profile

# Main battery thresholds (ThinkPad L13)
START_CHARGE_THRESH_BAT0=20
STOP_CHARGE_THRESH_BAT0=80

# CPU frequency scaling
CPU_DRIVER_INCLUDE_DRIVERS="amd_pstate intel_pstate"
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=50
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_MIN_FREQ_ON_AC=1400000
CPU_SCALING_MAX_FREQ_ON_AC=4800000
CPU_SCALING_MIN_FREQ_ON_BAT=1400000
CPU_SCALING_MAX_FREQ_ON_BAT=2400000

# Turbo boost control
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Intel GPU and PCI
INTEL_GPU_MIN_FREQ_ON_AC=400
INTEL_GPU_MAX_FREQ_ON_AC=1200
INTEL_GPU_MIN_FREQ_ON_BAT=400
INTEL_GPU_MAX_FREQ_ON_BAT=600
INTEL_GPU_BOOST_FREQ_ON_AC=1200
INTEL_GPU_BOOST_FREQ_ON_BAT=600

# USB auto-suspend
USB_AUTOSUSPEND=1
USB_AUTOSUSPEND_DISABLE_ON_SHUTDOWN=1

# NVMe/SSD power management
AHCI_RUNTIME_PM_ON_AC=auto
AHCI_RUNTIME_PM_ON_BAT=auto
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=min_power

# Networking
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Radeon GPU (if applicable)
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto
RADEON_DPM_STATE_ON_AC=performance
RADEON_DPM_STATE_ON_BAT=battery

# Suspend behavior
SUSPEND_MODULES="usbhid"

# Battery charging behavior
NATACPI_ENABLE=1
TPACPI_ENABLE=1
