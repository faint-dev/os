# Zog installed-system initramfs configuration.
# The live ISO overrides HOOKS via /etc/mkinitcpio.conf.d/99-archiso.conf,
# which the installer removes — installed systems regenerate with this file.
MODULES=(i915 xhci_pci ahci nvme sd_mod ext4)
BINARIES=()
FILES=()
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
# zstd -9: decompression speed (what boot time sees) is level-independent;
# -19 only adds minutes of build time for a marginally smaller image.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-9)
