---
# Zog installs systemd-boot only (no GRUB) — see docs/BOOT-OPTIMIZATION.md.
# Calamares generates the root= parameter itself; kernel_params below are
# appended. No zram kernel flag is needed: swap-on-zram is configured by
# zram-generator via /etc/systemd/zram-generator.conf.
efiBootLoader: "systemd-boot"
efiBootloaderId: "Zog"
timeout: "0"
installEFIFallback: true
kernel_params: [ "quiet", "rw", "intel_pstate=passive" ]
