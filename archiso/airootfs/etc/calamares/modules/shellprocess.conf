---
# Clean live-session artifacts out of the installed system, then
# regenerate the initramfs with the desktop config (the archiso hooks
# drop-in is removed here). "-" prefix = ignore failures.
dontChroot: false
timeout: 999
script:
  - "-rm -f /etc/mkinitcpio.conf.d/99-archiso.conf"
  - "-rm -f /etc/sddm.conf.d/autologin.conf"
  - "-rm -f /etc/sudoers.d/00-live"
  - "-rm -f /etc/systemd/system/zog-live-setup.service"
  - "-userdel -r zog"
  - "-pacman -Rns --noconfirm mkinitcpio-archiso calamares ckbcomp"
  - "mkinitcpio -P"
