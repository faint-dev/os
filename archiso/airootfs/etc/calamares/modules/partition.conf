---
# Zog automatic partitioning
# Layout (erase-disk mode): 512MB FAT32 ESP at /boot + ext4 root on the
# remaining space. No swap partition — swap is provided by zram
# (see /etc/systemd/zram-generator.conf).

efiSystemPartition: "/boot"
efiSystemPartitionSize: 512MiB
efiSystemPartitionName: EFI

# zram supplies swap; never create a swap partition or file.
userSwapChoices: [ none ]

initialPartitioningChoice: erase
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]

drawNestedPartitions: false
alwaysShowPartitionLabels: true
enableLuksAutomatedPartitioning: false
