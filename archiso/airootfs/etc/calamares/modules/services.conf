---
# Aligned with /etc/systemd/system-preset/90-zog.preset:
# NetworkManager owns networking — systemd-networkd must stay disabled
# or the two fight over interfaces.
services:
  enabled:
    - NetworkManager
    - systemd-resolved
    - systemd-timesyncd
    - tlp
    - thermald
    - bluetooth
    - ufw
    - fstrim.timer
  disabled:
    - systemd-networkd
