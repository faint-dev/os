---
# SSD-tuned mount options (see docs/BOOT-OPTIMIZATION.md).
# noatime: skip access-time writes on reads.
# commit=60: flush the ext4 journal every 60s instead of 5s.
# TRIM is handled by fstrim.timer (enabled via services.conf), not the
# discard mount option — periodic trim is the recommended approach for SSDs.
mountOptions:
  default: defaults,noatime
  ext4: defaults,noatime,commit=60
  btrfs: defaults,noatime,compress=zstd
ssdExtraMountOptions:
  btrfs: discard=async
efiMountOptions: umask=0077
