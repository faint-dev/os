[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Build-time only: provides bibata-cursor-theme (+ ckbcomp).
# The chaotic-mirrorlist package must be installed on the build host
# (CI does this in the "Bootstrap Chaotic AUR" step; see docs/BUILDING.md
# for the equivalent local setup). This repo is NOT enabled on installed systems.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

# Build-time only: provides calamares (not available in chaotic-aur or the
# official repos). EndeavourOS maintains an Arch-compatible calamares build.
# TrustAll is scoped to this repo and to ISO build time — the same HTTPS
# mirror would also be the keyring source, so verifying adds no trust anchor.
# This repo is NOT enabled on installed systems.
[endeavouros]
SigLevel = Optional TrustAll
Server = https://mirror.moson.org/endeavouros/repo/$repo/$arch
Server = https://mirror.alpix.eu/endeavouros/repo/$repo/$arch
