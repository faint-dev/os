[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Build-time only: provides calamares + bibata-cursor-theme-bin.
# The chaotic-mirrorlist package must be installed on the build host
# (CI does this in the "Bootstrap Chaotic AUR" step; see docs/BUILDING.md
# for the equivalent local setup). This repo is NOT enabled on installed systems.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
