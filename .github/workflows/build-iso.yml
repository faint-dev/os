name: Build Zog ISO

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    container:
      image: archlinux:base-devel
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archiso git dosfstools libisoburn

      - name: Import Chaotic AUR key
        run: |
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          echo "[chaotic-aur]" >> /etc/pacman.conf
          echo "Server = https://chaotic.cx/chaotic-aur/" >> /etc/pacman.conf
          pacman -Syu --noconfirm

      - name: Generate packages
        run: bash scripts/gen-packages.sh

      - name: Sync theming
        run: bash scripts/sync-theming.sh || true

      - name: Build ISO
        run: |
          mkdir -p dist
          mkarchiso -v -w work -o dist archiso

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.iso > SHA256SUMS
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-artifact
          path: |
            dist/*.iso
            dist/SHA256SUMS
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.iso
            dist/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
