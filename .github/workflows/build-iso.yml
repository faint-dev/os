name: Build Zog ISO

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# A newer push supersedes any in-flight build of the same ref
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    container:
      image: archlinux:base-devel
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pacman package cache
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-${{ hashFiles('archiso/packages/*.txt') }}
          restore-keys: |
            pacman-pkg-

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archiso git dosfstools libisoburn

      - name: Bootstrap Chaotic AUR keyring and repository
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm

      - name: Generate packages
        run: bash scripts/gen-packages.sh

      - name: Sync theming
        run: bash scripts/sync-theming.sh || true

      - name: Build ISO
        run: |
          mkdir -p dist
          mkarchiso -v -w work -o dist archiso

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.iso > SHA256SUMS
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-artifact
          path: |
            dist/*.iso
            dist/SHA256SUMS
          retention-days: 30
          # The ISO's contents are already zstd-compressed (erofs); zipping
          # a 6GB ISO again wastes minutes of CPU for ~0% size gain.
          compression-level: 0

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.iso
            dist/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
